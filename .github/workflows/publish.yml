name: publish

# The internal pipeline cuts release/x.y.z tags and the repository mirror
# pushes them here. This workflow publishes to nuget.org via OIDC trusted
# publishing (no long-lived API keys) and cuts the GitHub release. The
# project version is overridden from the tag name.

on:
  push:
    tags:
      - "release/*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Pack at the tag version
        shell: bash
        run: dotnet pack "Proctorio.EditorConfig/Proctorio.EditorConfig.NuGet.Package/Proctorio.EditorConfig.NuGet.Package.csproj" -c Release -p:Version="${GITHUB_REF_NAME#release/}" -o packed
      # Exchanges the workflow's OIDC token for a short-lived nuget.org key;
      # a Trusted Publishing policy for this repo must exist on nuget.org.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        shell: bash
        run: dotnet nuget push "packed/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "v${GITHUB_REF_NAME#release/}" --generate-notes || echo "release already exists"
